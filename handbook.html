<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayfelGÇ'27 - Handbook & Conference</title>
    <!-- Font Awesome (Sosyal Medya İkonları) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- PDF.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --footer-bg: #0b1f2d;
            --footer-bottom-bar: #07141e;
            --accent: #e4ff65;
            --text-primary: #ffffff;
            --partners-text: #a0aec0;
            --partners-border: rgba(255, 255, 255, 0.1);
            --nav-border: rgba(255, 255, 255, 0.1);
            --footer-deco-border: #e4ff65;
            --bg-main: #0f2537;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #79dab3;
            background-image: 
                radial-gradient(at 10% 20%, #34d399 0px, transparent 50%),
                radial-gradient(at 90% 80%, #229971 0px);
            position: relative;
            overflow-x: hidden;
        }

        /* Arka plan dalga efektleri */
        .bg-wave-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #50d8a1;
            clip-path: ellipse(85% 60% at 30% 20%);
            z-index: 0;
        }

        .bg-wave-bottom {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 60vh;
            background: #ffffff;
            clip-path: ellipse(90% 65% at 70% 90%);
            z-index: 0;
        }

        /* Ana İçerik Alanı (PDF Kartı) */
        .main-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            flex-grow: 1;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: center;
        }

        /* PDF Kart Kutusu */
        .pdf-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18), 0 5px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
        }

        .pdf-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        .preview-wrapper {
            width: 100%;
            position: relative;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 520px;
        }

        canvas#pdf-render {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        .pdf-preview-img {
            width: 100%;
            height: auto;
            display: none;
        }

        .button-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            background-color: #b5d230;
            color: #0f2537;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            padding: 13px 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            transition: all 0.25s ease;
            cursor: pointer;
            z-index: 10;
        }

        .pdf-card:hover .button-overlay {
            background-color: #e4ff65;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .button-overlay svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00e699;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- YENİ SPONSOR KATEGORİLERİ (YAN YANA DİZİLİM) --- */
        .new-sponsors-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 20px;
            margin-top: 40px;
            border-top: 1px solid var(--partners-border);
            padding-top: 40px;
        }

        .new-sponsor-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .sponsor-cat-title {
            text-align: center;
            color: var(--accent);
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .partners-tier.new-tier {
            padding: 10px 0;
            border-top: none;
            border-bottom: none !important;
            margin-bottom: 0 !important;
        }

        .new-tier span { 
            font-size: 18px; 
            letter-spacing: 2px; 
            color: var(--text-primary); 
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--footer-bg);
            padding: 60px 8% 60px 8%; 
            display: flex;
            justify-content: center; 
            position: relative;
            z-index: 3; 
            box-shadow: 0 -20px 40px rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--nav-border);
        }

        .footer-links-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 80px;
            width: 100%;
            max-width: 1100px;
            padding-bottom: 50px;
            padding-right: 50px;
            margin: 0 auto;
            
            border-bottom: 14px solid var(--footer-deco-border);
            border-right: 14px solid var(--footer-deco-border);
            border-bottom-right-radius: 50px;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
            height: 100%; 
        }

        .footer-col h4 {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
        }

        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 15px; }

        .footer-col ul li a {
            color: var(--partners-text);
            text-decoration: none;
            transition: 0.3s;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .footer-col ul li a:hover {
            color: var(--accent);
            padding-left: 5px;
        }

        .apply-text { color: var(--accent) !important; }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            color: var(--partners-text);
            text-decoration: none;
        }

        .social-icons i {
            font-size: 24px;
            transition: 0.3s;
            cursor: pointer;
        }

        .social-icons i:hover {
            color: var(--accent);
            transform: translateY(-3px);
        }

        .footer-logo {
            margin-top: auto; 
            padding-top: 40px; 
            opacity: 0.8;
            transition: 0.3s;
        }

        .footer-logo:hover {
            opacity: 1;
            transform: scale(1.03);
        }

        .footer-logo img {
            width: 75%; 
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .bottom-bar {
            background-color: var(--footer-bottom-bar);
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--nav-border);
            font-size: 12px;
            color: var(--text-primary);
            position: relative;
            z-index: 3;
        }

        /* --- MOBIL UYUMLULUK --- */
        @media (max-width: 992px) {
            .footer-links-container {
                gap: 40px;
            }
        }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }

            .nav-right {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                height: 100vh;
                background: var(--bg-main);
                flex-direction: column;
                justify-content: center;
                gap: 40px;
                transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 1000;
                box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            }

            .nav-right.active { right: 0; }

            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 25px;
            }

            .nav-links a { font-size: 16px; opacity: 1; }

            .hero-content { padding: 30px 20px; width: 92%; margin-top: 130px; }
            .hero-content h1 { font-size: clamp(50px, 12vw, 75px); }

            .hero-content::before {
                width: 190px; 
                height: 190px; 
                top: -160px; 
                left: -40px; 
                transform: translateY(15px);
            }

            .countdown { 
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                max-width: 250px;
                margin: 20px auto 0 auto;
            }

            .time-box span { font-size: 24px; }
            
            .floating-gallery-btn {
                bottom: 20px;
                left: 20px;
                padding: 10px 18px;
                font-size: 11px;
            }

            .partners-tier {
                flex-direction: column;
                gap: 25px;
                padding: 30px 0;
            }
            
            .tier-1 span { font-size: 20px; }
            .tier-2 span { font-size: 16px; }
            .tier-3 span { font-size: 12px; }
            .tier-4 span { font-size: 14px; }

            .new-sponsors-container {
                flex-direction: column;
                gap: 30px;
            }

            .footer-links-container {
                grid-template-columns: 1fr;
                gap: 40px;
                padding-right: 25px;
                padding-bottom: 35px;
                border-bottom: 10px solid var(--footer-deco-border);
                border-right: 10px solid var(--footer-deco-border);
                border-bottom-right-radius: 35px;
                text-align: left;
            }

            .footer-logo {
                margin-top: 25px;
                padding-top: 0;
            }
            
            .social-icons { justify-content: flex-start; }
            .bottom-bar { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="bg-wave-top"></div>
    <div class="bg-wave-bottom"></div>

    <!-- Ortadaki PDF Kartı -->
    <main class="main-content">
        <div class="container">
            <a href="handbook.pdf" target="_blank" class="pdf-card" title="Delegate Handbook PDF'ini Aç">
                <div class="preview-wrapper">
                    <div class="loading-spinner" id="loader"></div>
                    <canvas id="pdf-render"></canvas>
                    <img src="handbook_preview.jpg" alt="PDF Önizleme" class="pdf-preview-img" id="fallback-img">
                </div>
                
                <div class="button-overlay">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                    View PDF
                </div>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-links-container">
            
            <div class="footer-col">
                <h4>CONFERENCE</h4>
                <ul>
                    <li><a href="/">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="team.html">TEAM</a></li>
                    <li><a href="committees.html">COMMITTEES</a></li> 
                    <li><a href="calendar.html">CALENDAR</a></li> 
                    <li><a href="venue.html">VENUE</a></li>
                    <li><a href="handbook.pdf" target="_blank">HANDBOOK</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                    <li><a href="apply.html" class="apply-text">APPLY NOW</a></li>
                </ul>
            </div>

            <div class="footer-col">
                <div class="col-content">
                    <h4>LEGAL</h4>
                    <ul>
                        <li><a href="terms.html">TERMS & CONDITIONS</a></li>
                        <li><a href="privacy.html">PRIVACY POLICY</a></li>
                    </ul>
                </div>
                
                <div class="footer-logo">
                    <a href="/">
                        <img src="RayfelmunLogo.png" alt="RayfelGÇ Logo">
                    </a>
                </div>
            </div>

            <div class="footer-col">
                <div class="col-content">
                    <h4>SOCIAL</h4>
                    <div class="social-icons">
                        <a href="https://www.instagram.com/RayfelGÇ/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                        <a href="https://www.linkedin.com/school/ramazan-yaman-fen-lisesi/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
                
                <div class="footer-logo">
                    <a href="https://ramazanyamanfenlisesi.meb.k12.tr/" target="_blank" rel="noopener" aria-label="Ramazan Yaman Fen Lisesi">
                        <img src="ryfl-logo.png" alt="Ramazan Yaman Fen Lisesi Logo">
                    </a>
                </div>
            </div>

        </div>
    </footer>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <span>&copy; 2026 RayfelGÇ. All Rights Reserved.</span>
        <span>Ramazan Yaman Fen Lisesi</span>
    </div>

    <!-- PDF.js Script -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdfUrl = 'handbook.pdf';
        const canvas = document.getElementById('pdf-render');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');
        const fallbackImg = document.getElementById('fallback-img');

        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
            pdf.getPage(1).then(page => {
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    loader.style.display = 'none';
                });
            });
        }).catch(err => {
            console.warn('PDF.js render yüklenemedi:', err);
            loader.style.display = 'none';
            canvas.style.display = 'none';
            fallbackImg.style.display = 'block';
        });
    </script>
</body>
</html>
