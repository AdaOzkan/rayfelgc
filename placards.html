<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayfelmun '26 Delege Başvurusu</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a0d24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .form-container {
            background-color: #231130;
            border: 1px solid #3b204e;
            border-radius: 12px;
            max-width: 650px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .form-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #27f4d2;
            padding-bottom: 15px;
        }
        .form-header h2 {
            color: #27f4d2;
            margin: 0;
            text-transform: uppercase;
        }
        .section-title {
            color: #27f4d2;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #cccccc;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #142948;
            border: 1px solid #3b204e;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #27f4d2;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27f4d2;
            color: #142948;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1fe0c0;
        }
        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <h2>Rayfelmun '26</h2>
        <p style="color: #cccccc; margin: 5px 0 0 0; font-size: 14px;">Yeni Delege Başvuru Formu</p>
    </div>

    <form id="delegateForm">
        <!-- Komite & Ülke -->
        <div class="section-title">Tercihler</div>
        <div class="form-row">
            <div class="form-group">
                <label for="committee">Komite</label>
                <input type="text" id="committee" name="committee" placeholder="Örn: DISEC" required>
            </div>
            <div class="form-group">
                <label for="country">Ülke Tercihi</label>
                <input type="text" id="country" name="country" placeholder="Örn: Fransa" required>
            </div>
        </div>

        <!-- Kişisel Bilgiler -->
        <div class="section-title">Kişisel Bilgiler</div>
        <div class="form-row">
            <div class="form-group">
                <label for="user_name">Ad</label>
                <input type="text" id="user_name" name="user_name" required>
            </div>
            <div class="form-group">
                <label for="user_surname">Soyad</label>
                <input type="text" id="user_surname" name="user_surname" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="user_email">E-posta</label>
                <input type="email" id="user_email" name="user_email" required>
            </div>
            <div class="form-group">
                <label for="user_phone">Telefon</label>
                <input type="tel" id="user_phone" name="user_phone" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="user_id">TC / Pasaport No</label>
                <input type="text" id="user_id" name="user_id" required>
            </div>
            <div class="form-group">
                <label for="user_school">Okul</label>
                <input type="text" id="user_school" name="user_school" required>
            </div>
        </div>

        <!-- Deneyim & Diyet -->
        <div class="section-title">Deneyim & Özel Durumlar</div>
        <div class="form-group">
            <label for="user_experience">MUN Deneyimi</label>
            <textarea id="user_experience" name="user_experience" rows="3" placeholder="Önceki katıldığınız konferanslar ve rolleriniz..."></textarea>
        </div>
        <div class="form-group">
            <label for="user_diet">Diyet Durumu / Alerji</label>
            <input type="text" id="user_diet" name="user_diet" placeholder="Vejetaryen, Vegan, Alerji vb. (Yoksa 'Yok' yazınız)">
        </div>

        <!-- İletişim -->
        <div class="section-title">İletişim Kişileri</div>
        <div class="form-row">
            <div class="form-group">
                <label for="parent_name">Veli Ad Soyad</label>
                <input type="text" id="parent_name" name="parent_name" required>
            </div>
            <div class="form-group">
                <label for="parent_phone">Veli Telefon</label>
                <input type="tel" id="parent_phone" name="parent_phone" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="advisor_name">Danışman Öğretmen Adı</label>
                <input type="text" id="advisor_name" name="advisor_name">
            </div>
            <div class="form-group">
                <label for="advisor_phone">Danışman Telefon</label>
                <input type="tel" id="advisor_phone" name="advisor_phone">
            </div>
        </div>

        <!-- Ödeme & Notlar -->
        <div class="section-title">Ödeme ve Notlar</div>
        <div class="form-group">
            <label for="receipt_link">Dekont Linki (Drive/Cloud)</label>
            <input type="url" id="receipt_link" name="receipt_link" placeholder="https://..." required>
        </div>
        <div class="form-group">
            <label for="user_extra">Ek Notlar</label>
            <textarea id="user_extra" name="user_extra" rows="2" placeholder="Belirtmek istediğiniz ek bir bilgi varsa..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Başvuruyu Gönder</button>
    </form>

    <div id="status-message"></div>
</div>

<script>
    (function() {
        // EmailJS Public Key'inizi buraya girin
        emailjs.init("uyIAcNvuNYaqgUC5F");
    })();

    document.getElementById('delegateForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-message');
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Gönderiliyor...";
        statusMsg.innerText = "";

        // EmailJS Şablon ID'leri
        const serviceID = "service_ftvkm3g";
        const templateID = "template_aubvd8o";

        emailjs.sendForm(serviceID, templateID, this)
            .then(function() {
                statusMsg.style.color = "#27f4d2";
                statusMsg.innerText = "Başvurunuz başarıyla gönderildi!";
                document.getElementById('delegateForm').reset();
                submitBtn.disabled = false;
                submitBtn.innerText = "Başvuruyu Gönder";
            }, function(error) {
                statusMsg.style.color = "#ff6b6b";
                statusMsg.innerText = "Bir hata oluştu: " + JSON.stringify(error);
                submitBtn.disabled = false;
                submitBtn.innerText = "Başvuruyu Gönder";
            });
    });
</script>

</body>
</html>
